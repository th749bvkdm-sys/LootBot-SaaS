services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lootbot
      POSTGRES_USER: lootbot
      POSTGRES_PASSWORD: lootbot
    ports:
      - "5432:5432"
    volumes:
      - lootbot-postgres:/var/lib/postgresql/data

volumes:
  lootbot-postgres:
